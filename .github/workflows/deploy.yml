# Déploiement automatique sur le VPS à chaque push sur main (comme Vercel).
# Secrets GitHub à créer (Settings → Secrets and variables → Actions) :
#   VPS_HOST (IP du VPS), VPS_USER (ubuntu), VPS_SSH_KEY (clé privée SSH), VPS_APP_DIR (dossier du site sur le VPS)
name: Déploiement VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-vps
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mise à jour du site sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Récupère d'abord le code (le script de déploiement arrive avec lui), puis le lance.
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            bash scripts/deploy.sh "${{ secrets.VPS_APP_DIR }}"
