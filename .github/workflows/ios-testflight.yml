# Application iPhone : compilée sur un Mac de GitHub, signée automatiquement et envoyée sur TestFlight.
# Lancement manuel : onglet Actions → « iPhone → TestFlight » → Run workflow.
# Secrets nécessaires (Settings → Secrets and variables → Actions) :
#   APPLE_TEAM_ID, IOS_BUNDLE_ID, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 (contenu du fichier .p8)
name: iPhone → TestFlight
on: workflow_dispatch

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer le projet iPhone
        run: ./ios-setup.sh

      - name: Clé App Store Connect
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Compiler (Flutter)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archiver et signer (signature automatique Apple)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Envoyer sur TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
