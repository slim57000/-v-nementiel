# Application iPhone : compilée sur un Mac de GitHub, signée automatiquement et envoyée sur TestFlight.
# Lancement manuel : onglet Actions → « iPhone → TestFlight » → Run workflow.
# Secrets nécessaires (Settings → Secrets and variables → Actions) :
#   APPLE_TEAM_ID, IOS_BUNDLE_ID, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 (contenu du fichier .p8)
name: iPhone → TestFlight
on: workflow_dispatch

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      # Apple exige le SDK iOS 26 (Xcode 26 ou plus) : on prend le plus récent installé sur le Mac.
      - name: Choisir Xcode 26+
        working-directory: .
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || { echo "Xcode 26 introuvable sur ce Mac"; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer le projet iPhone
        run: ./ios-setup.sh

      - name: Clé App Store Connect
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Compiler (Flutter)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archiver et signer (signature automatique Apple)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Certificat de distribution et profil (API App Store Connect)
        env:
          KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 asc_signing.py setup

      - name: Envoyer sur TestFlight
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Supprimer le certificat et le profil temporaires
        if: always()
        env:
          KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
        run: python3 asc_signing.py cleanup || true
