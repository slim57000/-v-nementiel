<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e8137a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Quicksand:wght@600;700&display=swap">
  <link rel="modulepreload" href="/js/common.js">
  <link rel="modulepreload" href="/js/icons.js">
  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="stylesheet" href="/css/app.css?v=105">
  <link rel="icon" href="/img/logo.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MaFeliza">
  <title>Contact — MaFeliza</title>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <header class="topbar"><a class="logo" href="/"><img src="/img/logo.png" alt=""><span>MaFel<b>i</b>za</span></a></header>
  <main class="container" style="max-width:520px">
    <h1 style="text-align:center">Nous contacter</h1>
    <p class="muted" style="text-align:center">Une question, un souci, une idée ? Écrivez-nous, nous répondons par email.</p>
    <form id="contact" class="card" novalidate>
      <label for="c-name">Votre nom</label><input id="c-name" maxlength="80" autocomplete="name">
      <label for="c-email">Votre email</label><input id="c-email" type="email" maxlength="200" autocomplete="email" required>
      <label for="c-subject">Sujet</label><input id="c-subject" maxlength="120">
      <label for="c-message">Message</label><textarea id="c-message" rows="6" maxlength="5000" required></textarea>
      <p id="c-error" class="error" role="alert"></p>
      <button class="btn btn-block btn-big">✉️ Envoyer</button>
    </form>
    <p class="muted small" style="text-align:center">Ou par email : <a href="mailto:contact@mafeliza.com">contact@mafeliza.com</a></p>
  </main>
  <script type="module">
    import { api, $, toast } from "/js/common.js";
    $("#contact").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("#c-error").textContent = "";
      try {
        await api("/api/contact", { method: "POST", body: { name: $("#c-name").value, email: $("#c-email").value, subject: $("#c-subject").value, message: $("#c-message").value } });
        $("#contact").innerHTML = '<p style="text-align:center;font-size:1.1rem">✅ Message envoyé !<br><span class="muted">Nous vous répondons très vite par email.</span></p>';
      } catch (err) { $("#c-error").textContent = err.message; }
    });
  </script>
</body>
</html>
