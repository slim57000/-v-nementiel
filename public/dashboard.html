<!doctype html>
<html lang="fr">
<head>

  <meta name="theme-color" content="#e8137a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Quicksand:wght@600;700&display=swap">
  <link rel="modulepreload" href="/js/common.js">
  <link rel="modulepreload" href="/js/icons.js">
  <link rel="modulepreload" href="/js/i18n.js">

<body>
  <header class="topbar">
    <a class="logo" href="/dashboard"><img src="/img/logo.png" alt=""><span>MaFel<b>i</b>za</span></a>
    <button type="button" class="fav-btn" aria-label="Mes favoris" id="fav-btn">❤️</button>
  </header>
  <main class="container">
    <div class="stories" id="stories"></div>

    <div class="segments" role="tablist">
      <button class="active" data-filter="all">Tout</button>
      <button data-filter="live">🔴 En direct</button>
      <button data-filter="feed">Fil</button>
    </div>

    <div id="list"></div>
    <div id="empty" class="card hidden" style="text-align:center">
      <p style="font-size:2.5rem;margin:0">🎉</p>
      <p id="empty-text">Vous n'avez pas encore d'événement.<br>Créez le premier en quelques minutes !</p>
      <a href="/edit" class="btn">+ Créer un événement</a>
    </div>
  </main>
  <script type="module" src="/js/dashboard.js?v=5"></script>
