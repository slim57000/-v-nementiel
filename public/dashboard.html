<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d81f4f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/img/logo.png" type="image/png">
  <title>Accueil — EverMoments</title>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/dashboard"><img src="/img/logo.png" alt=""><span>Ever<b>Moments</b></span></a>
    <a href="/profil" class="btn btn-ghost btn-sm" aria-label="Profil" id="profile-btn"></a>
  </header>
  <main class="container">
    <div class="stories" id="stories"></div>

    <div class="segments" role="tablist">
      <button class="active" data-filter="all">Pour vous</button>
      <button data-filter="live">En direct</button>
      <button data-filter="upcoming">À venir</button>
    </div>

    <div id="list"></div>
    <div id="empty" class="card hidden" style="text-align:center">
      <p style="font-size:2.5rem;margin:0">🎉</p>
      <p id="empty-text">Vous n'avez pas encore d'événement.<br>Créez le premier en quelques minutes !</p>
      <a href="/edit" class="btn">+ Créer un événement</a>
    </div>
  </main>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
