<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e8137a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Quicksand:wght@600;700&display=swap">
  <link rel="modulepreload" href="/js/common.js">
  <link rel="modulepreload" href="/js/icons.js">
  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="stylesheet" href="/css/app.css?v=115">
  <link rel="icon" href="/img/logo.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MaFeliza">
  <title>Page introuvable — MaFeliza</title>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main class="container centered" style="max-width:480px;text-align:center;padding-top:12vh">
    <p><a class="logo logo-lg" href="/"><img src="/img/logo.png" alt=""><span>MaFel<b>i</b>za</span></a></p>
    <p style="font-size:3rem;margin:24px 0 0">🎈</p>
    <h1>Page introuvable</h1>
    <p class="muted">Ce lien n'existe pas ou l'événement a été supprimé. Vérifiez le lien reçu ou saisissez votre code d'invitation.</p>
    <p class="muted small" id="redirect-note">Redirection vers l'accueil…</p>
    <a href="/" id="home-link" class="btn btn-block" style="margin-top:18px">Retour à l'accueil</a>
    <a href="/decouvrir" class="btn btn-ghost btn-block" style="margin-top:10px">Découvrir les événements</a>
  </main>
  <script type="module" src="/js/i18n.js"></script>
  <script>
    // Lien mort (ex. événement supprimé) : retour automatique sur le site, à l'accueil connecté si possible.
    fetch("/api/auth/me").then((r) => (r.ok ? "/dashboard" : "/")).catch(() => "/").then((to) => {
      document.getElementById("home-link").href = to;
      setTimeout(() => location.replace(to), 2500);
    });
  </script>
</body>
</html>
