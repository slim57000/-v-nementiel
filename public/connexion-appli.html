<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e8137a">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Quicksand:wght@600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="modulepreload" href="/js/common.js">
  <link rel="modulepreload" href="/js/icons.js">
  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="stylesheet" href="/css/app.css?v=123">
  <link rel="icon" href="/img/logo.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MaFeliza">
  <title>Connexion à l'appli — MaFeliza</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <main class="container" style="max-width:440px;padding-top:8vh;text-align:center">
    <p><a href="/" class="logo logo-lg"><img src="/img/logo.png" alt=""><span>MaFel<b>i</b>za</span></a></p>
    <section id="ask" class="card hidden">
      <h1 style="font-size:1.3rem">Connexion à l'appli MaFeliza</h1>
      <p>L'appli affiche-t-elle ce code ?</p>
      <p id="code" style="font-size:3rem;font-weight:800;letter-spacing:.1em;margin:8px 0"></p>
      <form method="post" action="/api/auth/google/app-confirm">
        <input type="hidden" name="id" id="id">
        <button class="btn btn-block">Oui, me connecter dans l'appli</button>
      </form>
      <p style="margin-top:12px"><a href="/">Non, je n'ai rien demandé</a></p>
    </section>
    <section id="ok" class="card hidden">
      <p style="font-size:3rem;margin:0">✅</p>
      <h1 style="font-size:1.3rem">C'est fait !</h1>
      <p>Revenez dans l'appli MaFeliza : vous y êtes connecté.</p>
    </section>
    <section id="ko" class="card hidden">
      <h1 style="font-size:1.3rem">Connexion Google interrompue</h1>
      <p>Revenez dans l'appli MaFeliza et réessayez.</p>
    </section>
  </main>
  <script type="module">
    import "/js/common.js";
    const q = new URLSearchParams(location.search), show = (id) => document.getElementById(id).classList.remove("hidden");
    if (q.get("id") && /^\d{2}$/.test(q.get("c") || "")) {
      document.getElementById("id").value = q.get("id");
      document.getElementById("code").textContent = q.get("c");
      show("ask");
    } else show(q.get("etat") === "ok" ? "ok" : "ko");
  </script>
</body>
</html>
