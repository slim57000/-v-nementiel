<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=46">
  <link rel="stylesheet" href="/css/live.css?v=16">
  <link rel="icon" href="/img/logo.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EverMoments">
  <title>Live — EverMoments</title>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="live has-live-tabs">
  <header class="live-bar">
    <span class="live-badge">LIVE</span>
    <span class="viewers hidden" id="viewers" aria-label="Spectateurs"></span>
    <h1 id="title">Chargement…</h1>
    <button id="share" aria-label="Partager">↗</button>
    <a id="close" href="/" aria-label="Fermer">✕</a>
  </header>

  <div class="live-stage" id="stage">
    <div class="live-empty" id="empty"><span style="font-size:2rem">📡</span>Le direct n'a pas encore commencé.</div>
    <a class="live-pot hidden" id="pot" target="_blank" rel="noopener">
      <span>🎁</span><span><b>Cagnotte</b>Participer ›</span>
    </a>
    <div class="floaters" id="floaters" aria-hidden="true"></div>
  </div>

  <main class="live-body">
    <div class="chat-list" id="chat-list" aria-live="polite"><p class="chat-empty">Soyez le premier à écrire un message 💬</p></div>
    <form class="chat-input" id="chat">
      <input id="chat-text" placeholder="Écrire un message…" maxlength="200" aria-label="Message">
      <button aria-label="Envoyer">➤</button>
    </form>

    <div class="reactions" id="reactions">
      <button data-emoji="❤️"><i>❤️</i>J'aime</button>
      <button data-emoji="👏"><i>👏</i>Applaudir</button>
      <button data-emoji="😍"><i>😍</i>Cœur</button>
      <button data-emoji="🎆"><i>🎆</i>Feu d'artifice</button>
      <button data-emoji="🍾"><i>🍾</i>Champagne</button>
      <a class="btn pot-btn hidden" id="pot-btn" target="_blank" rel="noopener" aria-label="Cagnotte">🎁</a>
    </div>

    <section id="cams-section" class="hidden">
      <div class="live-section"><h2>Changer de caméra</h2></div>
      <div class="cams" id="cams"></div>
    </section>

    <section>
      <div class="live-section"><h2>Photos des invités<span class="count" id="photo-count"></span></h2></div>
      <div class="photo-strip" id="photo-strip">
        <div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div>
        <button id="add-photo" aria-label="Ajouter une photo">+</button>
      </div>
    </section>
  </main>

  <nav class="live-tabs" aria-label="Sections du live">
    <a href="#chat-list" data-nav-icon="chat">Chat</a>
    <a href="#reactions" data-nav-icon="heart">Réactions</a>
    <a href="#pot-btn" data-nav-icon="gift" id="nav-pot">Cagnotte</a>
    <a href="#photo-strip" data-nav-icon="camera">Photos</a>
    <a href="#cams-section" data-nav-icon="video">Caméras</a>
  </nav>

  <script type="module" src="/js/live.js"></script>
</body>
</html>
