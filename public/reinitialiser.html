<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e8137a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Quicksand:wght@600;700&display=swap">
  <link rel="modulepreload" href="/js/common.js">
  <link rel="modulepreload" href="/js/icons.js">
  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="stylesheet" href="/css/app.css?v=122">
  <link rel="icon" href="/img/logo.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MaFeliza">
  <title>Nouveau mot de passe — MaFeliza</title>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main class="container" style="max-width:440px;padding-top:6vh">
    <p style="text-align:center"><a href="/" class="logo logo-lg"><img src="/img/logo.png" alt=""><span>MaFel<b>i</b>za</span></a></p>
    <h1 style="text-align:center;font-size:1.4rem">Nouveau mot de passe</h1>
    <form id="reset" class="card login-centered" novalidate>
      <label for="pw1">Nouveau mot de passe</label>
      <input id="pw1" type="password" autocomplete="new-password" minlength="8" placeholder="8 caractères minimum">
      <label for="pw2">Confirmez le mot de passe</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8">
      <p id="error" class="error" role="alert"></p>
      <button class="btn btn-block" style="margin-top:8px">Enregistrer et me connecter</button>
    </form>
  </main>
  <script type="module">
    import { api } from "/js/common.js";
    const token = new URLSearchParams(location.search).get("token") || "";
    document.getElementById("reset").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("error"), a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
      if (a !== b) return (err.textContent = "Les deux mots de passe ne sont pas identiques.");
      try { await api("/api/auth/reset", { method: "POST", body: { token, password: a } }); location.replace("/dashboard"); }
      catch (x) { err.textContent = x.message; }
    });
  </script>
</body>
</html>
