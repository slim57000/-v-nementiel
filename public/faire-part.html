<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e8137a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&family=Inter:wght@400;600;800&family=Quicksand:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=63">
  <link rel="stylesheet" href="/css/invitation.css?v=6">
  <link rel="icon" href="/img/logo.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MaFeliza">
  <title>Mes faire-part — MaFeliza</title>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/dashboard"><img src="/img/logo.png" alt=""><span>MaFel<b>i</b>za</span></a>
  </header>
  <main class="container centered">
    <h1 class="fp-title">Mes faire-part</h1>
    <div class="segments fp-tabs" role="tablist">
      <button class="active" data-tab="invite">Faire-part</button>
      <button data-tab="live">Invitation au live</button>
    </div>

    <div id="card"></div>

    <div class="fp-qr">
      <img id="qr" alt="QR code">
      <div style="text-align:left;min-width:0">
        <b id="qr-title"></b>
        <p class="muted" id="qr-link"></p>
        <p id="qr-code-line" class="hidden">Code : <span class="code" id="qr-code"></span></p>
      </div>
    </div>

    <div class="fp-actions">
      <button class="btn" id="share">Partager</button>
      <button class="btn btn-light" id="copy">Copier le lien</button>
      <button class="btn btn-light" id="print">Imprimer / PDF</button>
      <a class="btn btn-ghost" id="edit">Modifier</a>
    </div>
  </main>
  <script type="module" src="/js/faire-part.js"></script>
</body>
</html>
