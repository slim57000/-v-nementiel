<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e8137a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Quicksand:wght@600;700&display=swap">
  <link rel="modulepreload" href="/js/common.js">
  <link rel="modulepreload" href="/js/icons.js">
  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="stylesheet" href="/css/app.css?v=112">
  <link rel="icon" href="/img/logo.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MaFeliza">
  <title>Messages — MaFeliza</title>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/dashboard"><img src="/img/logo.png" alt=""><span>MaFel<b>i</b>za</span></a>
  </header>

  <main class="container" id="list-view">
    <h1 style="text-align:center">Messages</h1>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px"><button type="button" class="btn" id="add-friend" style="min-width:0;white-space:nowrap;padding-inline:6px;font-size:.95rem"><b style="font-size:1.15em;line-height:1">+</b> Ajouter un ami</button><a href="/amis" class="btn btn-light" style="min-width:0;white-space:nowrap;padding-inline:6px;font-size:.95rem">👥 Mes amis</a></div>
    <div id="friends"></div>
    <p id="no-friends" class="card hidden" style="text-align:center">
      Vous n'avez pas encore d'amis.<br><span class="muted small">Touchez « Ajouter un ami » et envoyez votre lien à vos proches : un clic et vous êtes amis. Les invités de vos événements privés deviennent aussi vos amis automatiquement.</span>
    </p>
    <details id="blocked-box" class="card hidden">
      <summary><b>Personnes bloquées</b> <span class="muted" id="blocked-count"></span></summary>
      <div id="blocked"></div>
    </details>
  </main>

  <main class="container dm hidden" id="dm-view">
    <div class="dm-head">
      <a href="/messages" class="btn btn-ghost btn-sm" aria-label="Retour">←</a>
      <span class="avatar" id="dm-avatar"></span>
      <b id="dm-name"></b>
      <button class="more-btn" id="dm-more" aria-label="Plus d'actions">⋯</button>
    </div>
    <div class="dm-thread" id="thread"></div>
    <form class="dm-input" id="dm-form">
      <input id="dm-text" maxlength="1000" placeholder="Écrire un message…" autocomplete="off" aria-label="Message">
      <button class="btn btn-sm" aria-label="Envoyer">➤</button>
    </form>
  </main>
  <script type="module" src="/js/messages.js?v=2"></script>
</body>
</html>
